<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadet Registration | TitanX Robotics</title>

  <link rel="icon" type="image/png" href="favicon.png">
  
  <!-- Core Design System -->
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 100px 20px 40px;
    }

    .reg-container {
      max-width: 500px;
      width: 100%;
      padding: 36px 30px;
      border-radius: 20px;
      position: relative;
      z-index: 10;
    }

    .reg-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .reg-logo {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--neon-cyan);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
      margin-bottom: 16px;
    }

    .reg-title {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .reg-subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-family: var(--font-heading);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      color: var(--neon-cyan);
      pointer-events: none;
    }

    .reg-container input, .reg-container select {
      padding-left: 42px;
    }

    select.cyber-input {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f0ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      margin-top: 10px;
      border-radius: 12px;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      color: var(--text-dim);
      font-family: var(--font-heading);
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: var(--neon-cyan);
    }
  </style>
</head>

<body>

  <!-- 🎯 CUSTOM HIGH-TECH CURSOR -->
  <div class="custom-cursor-dot" id="cursorDot"></div>
  <div class="custom-cursor-ring" id="cursorRing"></div>

  <!-- 🎧 UNIVERSAL AUDIO ELEMENT -->
  <audio id="bgmusic" loop preload="auto">
    <source src="audio1.mp3" type="audio/mpeg">
    <source src="audio1.mpeg" type="audio/mpeg">
  </audio>

  <!-- 🎛️ FLOATING AUDIO CONTROLLER WIDGET -->
  <div class="audio-controller-widget" id="audioWidget" title="Click to Toggle Cyber Soundtrack">
    <button class="audio-btn paused" id="audioToggleBtn" aria-label="Audio Play/Pause">
      <span id="audioIcon">▶</span>
    </button>
    <div class="audio-equalizer">
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>
    <span class="audio-label" id="audioStatusText">AUDIO // TAP TO PLAY</span>
    <input type="range" class="audio-volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.5" title="Volume Control">
  </div>

  <!-- 🧭 CYBER HUD NAVBAR -->
  <header>
    <nav class="titan-navbar" aria-label="Main Navigation">
      <a href="home.html" class="titan-nav-brand">
        <img src="photo1.jpeg" alt="TitanX Logo">
        <span class="titan-nav-title">TITANX ROBOTICS</span>
      </a>

      <ul class="titan-nav-links">
        <li><a href="home.html" class="titan-nav-link">Home</a></li>
        <li><a href="home.html#events" class="titan-nav-link">Events</a></li>
        <li><a href="members.html" class="titan-nav-link">Active Members</a></li>
        <li><a href="register.html" class="titan-nav-link active">Join Us</a></li>
      </ul>

      <div>
        <a href="home.html" class="cyber-btn cyber-btn-ghost" style="padding: 8px 16px; font-size: 0.9rem;">
          ⬅ Back
        </a>
      </div>
    </nav>
  </header>

  <!-- 📝 REGISTRATION FORM CARD -->
  <div class="cyber-card reg-container corner-decor">
    <div class="reg-header">
      <img src="photo1.jpeg" alt="TitanX Logo" class="reg-logo floating-element">
      <h1 class="reg-title">
        <span class="text-gradient">Join TitanX Robotics</span>
      </h1>
      <p class="reg-subtitle">Apply to become a robotics cadet, innovator, or team contributor.</p>
    </div>

    <form id="regForm" onsubmit="return false;">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="name" class="cyber-input" placeholder="e.g. Alex Mercer" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" id="email" class="cyber-input" placeholder="name@domain.com" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="phone">Phone / WhatsApp</label>
        <div class="input-wrapper">
          <span class="input-icon">📱</span>
          <input type="tel" id="phone" class="cyber-input" placeholder="+91 98765 43210" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="domain">Primary Interest</label>
        <div class="input-wrapper">
          <span class="input-icon">🎯</span>
          <select id="domain" class="cyber-input">
            <option value="Autonomous Ground Vehicles & Robot Cars">Autonomous Ground Vehicles & Robot Cars</option>
            <option value="Drones & Aerial Quadcopters">Drones & Aerial Quadcopters</option>
            <option value="Embedded Systems & IoT (Arduino/ESP32)">Embedded Systems & IoT (Arduino/ESP32)</option>
            <option value="Computer Vision & AI Software">Computer Vision & AI Software</option>
            <option value="Media, Video Production & Design">Media, Video Production & Design</option>
          </select>
        </div>
      </div>

      <button type="button" id="submitBtn" class="cyber-btn submit-btn" onclick="submitRegistration()">
        <span>🚀 Initialize Registration</span>
      </button>
    </form>

    <div style="text-align: center;">
      <a href="home.html" class="back-link">⬅ Return to Home Overview</a>
    </div>
  </div>

  <!-- 🔥 FIREBASE FIRESTORE MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyArTaM2XXi8nSZCykIQi-yeq9zbb4sVauc",
      authDomain: "titanx-robotics.firebaseapp.com",
      projectId: "titanx-robotics",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.submitRegistration = async function() {
      const btn = document.getElementById("submitBtn");
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const domain = document.getElementById("domain").value;

      if (!name || !email || !phone) {
        alert("⚠️ Please fill in all required fields!");
        return;
      }

      try {
        btn.innerHTML = "<span>⏳ Transmitting Telemetry...</span>";
        btn.disabled = true;

        await addDoc(collection(db, "users"), {
          name: name,
          email: email,
          phone: phone,
          domain: domain,
          registeredAt: new Date().toISOString()
        });

        alert("🎉 Registration Confirmed! Welcome to TitanX Robotics.");

        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("phone").value = "";

        window.location.href = "home.html";

      } catch (error) {
        console.error("Firestore Error:", error);
        alert("❌ Transmit failed! Please verify internet connection or try again.");
      } finally {
        btn.innerHTML = "<span>🚀 Initialize Registration</span>";
        btn.disabled = false;
      }
    };
  </script>

  <!-- 🎵 UNIVERSAL AUDIO ENGINE -->
  <script src="audio-engine.js"></script>

  <!-- 🎯 CURSOR SCRIPT -->
  <script>
    const cursorDot = document.getElementById("cursorDot");
    const cursorRing = document.getElementById("cursorRing");

    document.addEventListener("mousemove", (e) => {
      cursorDot.style.left = e.clientX + "px";
      cursorDot.style.top = e.clientY + "px";
      cursorRing.style.left = e.clientX + "px";
      cursorRing.style.top = e.clientY + "px";
    });

    document.querySelectorAll("a, button, input, select, .cyber-card").forEach(elem => {
      elem.addEventListener("mouseenter", () => cursorRing.classList.add("active"));
      elem.addEventListener("mouseleave", () => cursorRing.classList.remove("active"));
    });
  </script>

</body>
</html>
